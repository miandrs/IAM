spring:
    application:
        name: keycloakadmin
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: https://preprod.sso.eqima.org/realms/EQIMA-Solution
                    jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs 
                    cache-duration: 3600s
    datasource:
        url: jdbc:mysql://localhost:3306/plateforme_Saas
        username: root
        password: root
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true
        database-platform: org.hibernate.dialect.MySQLDialect
    web:
        error:
            include-exception: false
            include-stacktrace: never
            include-message: always

